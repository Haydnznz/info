[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opinion-analysis-platform"
version = "0.2.0"
description = "Distributed public opinion analysis platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.139.0", "uvicorn==0.51.0", "pydantic==2.13.4", "python-dotenv==1.2.2",
  "requests==2.34.2", "httpx==0.28.1", "numpy==2.4.6", "pandas==3.0.3",
  "langgraph==1.2.9", "langchain==1.3.14", "langchain-openai==1.4.0", "openai==2.54.0",
  "pymilvus[model]==3.0.2", "minio==7.2.20", "pymongo==4.18.2",
  "FlagEmbedding==1.4.2", "sentence-transformers==5.6.1", "transformers==4.57.6",
  "dashscope==1.27.7", "mcp==1.30.0", "accelerate==1.15.0", "datasets==5.0.1",
  "peft==0.21.2", "ir-datasets==0.6.3", "sentencepiece==0.2.2"
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "runtime", "reports", "graphs", "outputs"]

[tool.ruff.lint]
# Start with correctness-oriented checks; legacy files can adopt style rules incrementally.
select = ["E9", "F63", "F7", "F82"]
