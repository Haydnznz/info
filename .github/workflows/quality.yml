name: Quality Harness

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_ENABLED: "true"
      AUTH_SECRET: github-actions-test-secret
      AUTH_ADMIN_USERNAME: admin
      AUTH_ADMIN_PASSWORD: github-actions-admin-password
      AUTH_OPERATOR_USERNAME: operator
      AUTH_OPERATOR_PASSWORD: github-actions-operator-password
      AUTH_VIEWER_USERNAME: viewer
      AUTH_VIEWER_PASSWORD: github-actions-viewer-password
      OPINION_WORKER_TOKEN: github-actions-worker-secret
      # Job-level env cannot evaluate the runner context. The browser and
      # unit tests use this workspace-local directory and recreate it per run.
      OPINION_DATA_DIR: ${{ github.workspace }}/.ci-data
      MONGO_ENABLED: "false"
      MILVUS_ENABLED: "false"
      LLM_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run Ruff correctness checks
        run: ruff check .

      - name: Run unit and integration tests
        run: python -m unittest discover -s test -v

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run browser smoke test
        run: python test/e2e/test_login_flow.py
