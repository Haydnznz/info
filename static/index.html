<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>舆情分析平台</title><style>
body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f4f7fb;color:#1f2937}header{background:#102a43;color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:22px}nav button{background:#244c73;border:0;color:#fff;padding:9px 12px;margin-left:6px;border-radius:6px;cursor:pointer}.wrap{max-width:1180px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;border-radius:10px;padding:18px;box-shadow:0 2px 10px #dbe3ee}.status{font-weight:bold}.running{color:#0f9d58}.stopped{color:#64748b}.starting,.stopping{color:#d97706}.failed{color:#dc2626}button.primary{background:#1677ff;color:#fff;border:0;border-radius:5px;padding:8px 12px;cursor:pointer}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:6px;margin:6px 0 12px}pre{white-space:pre-wrap;background:#0f172a;color:#d1fae5;border-radius:6px;padding:12px;min-height:90px}.tabs{margin:20px 0}.panel{display:none}.panel.active{display:block}.pill{display:inline-block;padding:4px 8px;border-radius:12px;background:#e0f2fe;color:#0369a1;font-size:12px}
</style></head><body><header><h1>舆情分析平台</h1><nav><button onclick="show('home')">控制台</button><button onclick="show('search')">主题检索</button><button onclick="show('forum')">论坛监控</button><button onclick="show('graph')">图谱查看</button><button onclick="show('config')">配置管理</button></nav></header><main class="wrap">
<section id="home" class="panel active"><div class="card"><h2>系统状态 <span id="sys" class="pill">加载中</span></h2><button class="primary" onclick="system('/api/system/start')">启动整体服务</button> <button onclick="system('/api/system/shutdown')">关闭整体服务</button><p id="errors"></p></div><h2>单功能应用</h2><div id="apps" class="grid"></div></section>
<section id="search" class="panel"><div class="card"><h2>主题检索与分析</h2><label>主题词</label><input id="query" value="人工智能大模型"><label>来源类型（逗号分隔）</label><input id="types" value="news,forum_post,internal_data"><button class="primary" onclick="search()">发起分析</button><div id="result"></div></div></section>
<section id="forum" class="panel"><div class="card"><h2>论坛监控</h2><p>状态：<b id="fstatus">-</b></p><button class="primary" onclick="forum('/api/forum/start')">启动采集</button> <button onclick="forum('/api/forum/stop')">停止采集</button><pre id="flog"></pre></div></section>
<section id="graph" class="panel"><div class="card"><h2>图谱查看器</h2><button class="primary" onclick="loadGraph()">加载最新图谱</button><pre id="graphout"></pre></div></section>
<section id="config" class="panel"><div class="card"><h2>配置管理</h2><textarea id="cfg" rows="18"></textarea><button class="primary" onclick="saveConfig()">保存配置</button></div></section>
</main><script src="/app.js"></script></body></html>
